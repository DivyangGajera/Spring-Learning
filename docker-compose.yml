services:
  demo:
    build: .
    image: demo:latest
    container_name: demo
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/tasks"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
